isplay:block;font-size:9px;color:var(--muted);margin-bottom:3px}.field select{width:100%;padding:6px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:10px}.book-card,.scope{border:1px solid #b8adec;background:#faf9ff;border-radius:9px;padding:7px;margin-bottom:6px}.book-card b,.book-card small{display:block}.book-card b{font-size:11px;color:var(--p)}.book-card small{font-size:8px;color:var(--muted);line-height:1.5;margin-top:3px}.two{display:grid;grid-template-columns:1fr 1fr;gap:4px}.two .btn{padding:6px;font-size:9px}.scope{display:grid;grid-template-columns:1fr auto;gap:4px}.scope span{font-size:9px;color:var(--muted)}.scope b{font-size:15px;color:var(--p)}.scope small{grid-column:1/-1;color:var(--muted);font-size:8px}.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:6px 0}.stats3 div{text-align:center;border:1px solid var(--line);border-radius:7px;padding:4px}.stats3 b,.stats3 small{display:block}.stats3 b{font-size:11px}.stats3 small{font-size:7px;color:var(--muted)}.chapters{display:grid;gap:4px;max-height:190px;overflow:auto}.chapter{display:grid;grid-template-columns:16px 1fr;gap:4px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px;text-align:left;font-size:9px}.chapter input{width:13px;height:13px;accent-color:var(--p)}.chapter b{display:block;font-size:9px}.chapter small{display:block;font-size:7px;color:var(--muted);margin-top:2px}.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.filter{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px;text-align:left;font-size:8px}.filter.on{border-color:var(--p);background:var(--soft);color:var(--p)}.apply{width:100%;margin-top:6px}.main{display:flex;flex-direction:column;min-width:0}.head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.head h1{font-size:16px;margin:0}.crumb{font-size:9px;color:var(--muted);margin-top:3px}.saved{font-size:9px;color:var(--green) <header class="top"><div class="brand"><small>STEMBank 数学</small><b>高中数学自主学习</b></div><div class="book"><label for="book">选择书籍</label><select id="book"><option value="ykyj">2026《高中数学·一课一练》上册</option><option value="mother">高中数学母题400题</option><option value="whx">王后雄《重难点手册·必修第一册》</option></select></div><div class="top-actions"><button class="btn primary">继续上次学习</button><button class="btn outline">更多</button><a class="btn outline" href="../index.html">数理化首页</a></div></header>

<script>
const DATA={ykyj:{name:'2026《高中数学·一课一练》上册',tabs:['章节练习','错题复习'],side:'ykyj'},mother:{name:'高中数学母题400题',tabs:['母题学习','变式训练','专项复习','错题复习'],side:'mother'},whx:{name:'王后雄《重难点手册·必修第一册》',tabs:['必备知识梳理','关键能力提升','核心素养聚焦','学业质量评测／培优突破练','单元复习归纳','微专题妙总结','单元学能测评','易错题'],side:'whx'}};let active='';const $=x=>document.getElementById(x);const chapters=['第1章 集合与逻辑','第2章 不等式','第3章 函数的概念、性质与应用','第4章 幂函数、指数函数与对数函数'];
function commonScope(){return `<div class="two"><button class="btn primary">在线/本地题库</button><button class="btn outline">题库管理</button></div><div class="scope"><span>当前学习范围</span><b>0章 · 0题</b><small>切换书籍后自动恢复该书上次范围</small></div>`}
function ykyj(){return `${commonScope()}<div class="book-card"><b>2026 一课一练上册 · 九章在线</b><div class="stats3"><div><b>0/9</b><small>缓存章节</small></div><div><b>0</b><small>学习题目</small></div><div><b>0/106</b><small>学习课次</small></div></div><div class="two"><button class="btn primary">整书离线安装</button><button class="btn outline">九章加入范围</button></div></div><div class="group"><div class="group-title">选择当前题库的章节（可多选）</div><div class="chapters">${chapters.map((x,i)=>`<label class="chapter"><input type="checkbox"><span><b>${x}</b><small>一课一练 · reviewed · ${143+i*13}题</small></span></label>`).join('')}</div><button class="btn outline apply">全选／取消</button><button class="btn primary apply">应用章节选择（0章）</button></div><div class="group"><label class="field"><span>选择本章课次／节</span><select disabled><option>全部已选课次（0题）</option></select></label></div><div class="group"><div class="group-title">今天练什么</div><div class="filter-grid"><button class="filter on">未做题<br>优先完成新题</button><button class="filter">错题<br>小错、部分会</button><button class="filter">已做题<br>复习做过的题</button><button class="filter">全部题<br>不限制状态</button></div></div><div class="group"><div class="group-title">难度</div><div class="filter-grid"><button class="filter on">基础题</button><button class="filter on">提升题</button></div></div>`}

function whx(){return `<div class="book-card"><b>重难点手册 · 必修第一册</b><small>保留原书页面、答案遮挡、掌握评价和正式练习。</small></div><div class="group"><label class="field"><span>章节</span><select><option>第一章 集合与常用逻辑用语</option><option>第二章 一元二次函数、方程和不等式</option></select></label><label class="field"><span>节</span><select><option>1.1 集合的概念</option><option>1.2 集合间的基本关系</option></select></label></div><div class="group"><div class="group-title">本节原书栏目</div><div class="chapters"><button class="chapter"><span></span><span><b>01 必备知识梳理</b><small>原书页面 · 可圈画</small></span></button><button class="chapter"><span></span><span><b>02 关键能力提升</b><small>例题答案遮挡</small></span></button><button class="chapter"><span></span><span><b>03 核心素养聚焦</b><small>例题答案遮挡</small></span></button><button class="chapter"><span></span><span><b>04 学业质量评测</b><small>正式练习</small></span></button></div></div><div class="group"><div class="group-title">复习状态</div><div class="filter-grid"><button class="filter on">继续上次阅读</button><button class="filter">未掌握内容</button><button class="filter">易错题</button><button class="filter">本书错题</button></div></div>`}
function render(){let id=$('book').value,d=DATA[id];if(!d.tabs.includes(active))active=d.tabs[0];$('tabs').innerHTML=d.tabs.map(x=>`<button data-tab="${x}" class="${x===active?'on':''}">${x}</button>`).join('')+`<span>${d.name}</span>`;document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});$('sideTitle').textContent=id==='mother'?'母题目录':id==='whx'?'原书学习目录':'章节题库';$('sidebar').innerHTML=id==='ykyj'?ykyj():id==='mother'?mother():whx();$('title').textContent=active;$('crumb').textContent=`${d.name} · ${active}`;$('content').innerHTML=`<article class="paper"><h3>${active}</h3><p>上方只负责选择书籍。此处及左侧完整保留该书原来的界面风格和学习逻辑，并根据书籍配置自动加载不同层级与筛选项。</p><div class="demo"><b>${id==='whx'?'原书页面与答案遮挡':'当前书籍学习内容'}</b><p>${id==='ykyj'?'保持现有章节多选、课次选择、状态和难度筛选。':id==='mother'?'按照专题和母题类型组织学习。':'按照原书栏目阅读、圈画、展开解析并记录掌握情况。'}</p><button>查看当前内容</button></div></article>`}
$('book').onchange=()=>{active='';render()};render();
</script></body></html>
